<div class="boas-vindas-container">
  
  <div class="conteudo-central">
    <!-- Logotipo -->
    <img src="logo_meditacao.jpg" alt="Logo Mesa da Meditação" class="logo">

    <!-- Título Principal -->
    <h1 class="titulo">Bem-Vindo ao<br>Mesa da Meditação</h1>

    <!-- Subtítulo / Frase Inspiracional -->
    <p class="subtitulo">
      O Espírito Santo mostra ao filho o caminho que se deve andar. Mas o olhar do filho para dentro de si, traz o caminhar em excelência.
    </p>
  </div>

  <!-- Botão Iniciar (Fica fixo na parte inferior, como no Android) -->
  <div class="botao-container">
    <button class="btn-iniciar" (click)="iniciarMeditacao()">
      Iniciar a Meditação
    </button>
  </div>

</div>
