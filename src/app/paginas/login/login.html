<div class="login-container">
  <div class="login-form-box">
    
    <img src="logo_meditacao.jpg" alt="Logo" class="logo">
    
    <h1 class="titulo">Mesa da Meditação</h1>
    <p class="subtitulo">Acesse sua conta para continuar</p>

    <!-- Form container -->
    <div class="form-inputs">
      
      <!--  Only visible when Registering (isLoginMode = false)  -->
      @if (!isLoginMode) {
        <div class="input-group">
          <input type="text" placeholder="Nome" [(ngModel)]="nome" class="text-input">
        </div>
      }

      <div class="input-group">
        <input type="email" placeholder="E-mail" [(ngModel)]="email" class="text-input">
      </div>

      <div class="input-group">
        <input type="password" placeholder="Senha" [(ngModel)]="senha" class="text-input">
      </div>

      <button class="btn-acao" (click)="onSubmit()">
        {{ isLoginMode ? 'ENTRAR' : 'CADASTRAR' }}
      </button>

      <p class="toggle-text" (click)="toggleMode()">
        {{ isLoginMode ? 'Não tem uma conta? Cadastre-se' : 'Já tem uma conta? Faça Login' }}
      </p>

    </div>
  </div>
</div>
