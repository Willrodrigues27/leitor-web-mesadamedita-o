<div class="home-container">
  
  <!-- Botão de voltar discreto (pode remover se não quiser que apareça) -->
  <button class="btn-voltar" (click)="voltarSumario()">← Voltar</button>

  <!-- Barra de Pesquisa -->
  <div class="search-bar">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" placeholder="Buscar livros..." class="search-input">
  </div>

  <!-- Lista de Livros -->
  <div class="lista-livros">
    @for (livro of livros; track livro.id) {
      
      <div class="livro-item" (click)="abrirLivro(livro.id)">
        <span class="livro-titulo">{{ livro.titulo }}</span>
        <span class="livro-descricao">{{ livro.descricao }}</span>
      </div>

    } @empty {
      <p class="mensagem-vazia">Nenhum livro disponível nesta seção.</p>
    }
  </div>

</div>
